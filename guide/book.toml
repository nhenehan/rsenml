[book]
title = "rsenml User Guide"
description = "Read and write SenML (RFC 8428) in JSON, CBOR, XML and EXI from Rust with rsenml, one example at a time."
authors = ["Nathan Henehan"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.search]
enable = true

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
