# Checks for every pull request, merge-queue run and push to main: the same steps
# as scripts/gate.sh, split into jobs that run side by side. Make "ci-ok" the one
# required status check in the branch protection rule for main.
# The release workflow (release.yml) runs this workflow too, before it releases.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, docs, tests, no_std, generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Third parties (rexi's schema generator)
        run: scripts/fetch-third-party.sh
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - name: rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: tests
        run: cargo test --workspace
      - name: no_std builds (thumbv7em-none-eabihf)
        run: |
          cargo build -p rsenml --target thumbv7em-none-eabihf
          for f in json cbor xml exi; do
              cargo build -p rsenml --target thumbv7em-none-eabihf --no-default-features --features "$f"
          done
      - name: generated EXI tables
        run: scripts/gen-tables.sh --check
      - name: exported vectors and cases (SenMLFormat)
        run: scripts/export-fixtures.sh --check

  msrv:
    name: tests on Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: tests
        run: cargo test --workspace

  exificient:
    name: EXIficient reference bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # exip's utils/xsd2exip (the EXIficient 1.0.7 oracle) targets Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Standards cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rsenml/standards
          key: standards-${{ hashFiles('standards.lock') }}
      - name: Standards (the full RFC 8428 text)
        run: scripts/fetch-standards.sh
      - name: RFC 8428 excerpts equal to the RFC text
        run: cargo test -p rsenml-tests --test extract
        env:
          RSENML_REQUIRE_STANDARDS: "1"
      - name: Third-party cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rsenml/third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('third-party.lock') }}
      - name: Third parties (rexi, exip)
        run: scripts/fetch-third-party.sh
      - name: EXIficient fixtures up to date
        run: scripts/gen-exi-fixtures.sh --check

  ci-ok:
    name: ci-ok
    if: always()
    needs: [checks, msrv, exificient]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          [[ "${{ needs.checks.result }}" == success && \
             "${{ needs.msrv.result }}" == success && \
             "${{ needs.exificient.result }}" == success ]]
