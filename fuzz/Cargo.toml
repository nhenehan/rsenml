[package]
name = "rsenml-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rsenml = { path = "../crates/rsenml" }

# Not part of the main workspace: cargo-fuzz needs nightly and its own lock.
[workspace]

[[bin]]
name = "decode_json"
path = "fuzz_targets/decode_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_cbor"
path = "fuzz_targets/decode_cbor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_xml"
path = "fuzz_targets/decode_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_exi"
path = "fuzz_targets/decode_exi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_decoders"
path = "fuzz_targets/stream_decoders.rs"
test = false
doc = false
bench = false

# Writes the seed corpus from the EXIficient fixtures (run.sh does this).
[[bin]]
name = "make_seeds"
path = "src/bin/make_seeds.rs"
test = false
doc = false
bench = false
