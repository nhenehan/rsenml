# Head-to-head comparison of rsenml with the other Rust SenML crates.
# `cargo run --release` writes ../doc/comparison.md. A standalone workspace:
# the main rsenml workspace excludes `compare`.
[workspace]
members = [
    ".",
    "probes/rsenml-all",
    "probes/rsenml-json",
    "probes/rsenml-cbor",
    "probes/rsenml-xml",
    "probes/rsenml-exi",
    "probes/sindit-senml",
    "probes/senml-cbor",
    "probes/coapum-senml",
    "footprint/baseline",
    "footprint/rsenml-cbor",
    "footprint/rsenml-json",
    "footprint/rsenml-exi",
    "footprint/senml-cbor",
]
# The footprint crates are #![no_std] binaries for thumbv7em-none-eabihf.
default-members = ["."]
resolver = "3"

[package]
name = "rsenml-compare"
version = "0.0.0"
edition = "2024"
publish = false
license = "BSD-3-Clause"
description = "Compares rsenml with sindit-senml, senml-cbor and coapum-senml; writes ../doc/comparison.md"

[dependencies]
rsenml = { path = "../crates/rsenml" }
sindit-senml = "0.3"
senml-cbor = "0.1"
# default features: json + cbor
coapum-senml = "0.1"
# Oracle-side helpers (independent of every library under test).
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1

# Used for the thumbv7em footprint binaries.
[profile.footprint]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = false
